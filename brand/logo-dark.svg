<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" role="img" aria-label="budget THRILLS">
  <defs>
    <!-- Neon lime glow -->
    <filter id="limeGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle vignette for the dark canvas -->
    <radialGradient id="bgFade" cx="50%" cy="50%" r="65%">
      <stop offset="0%"  stop-color="#101010"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
  </defs>

  <!-- Background: transparent so it inherits any canvas behind it -->

  <!-- WORDMARK -->
  <!-- "budget" — thin, off-white, lowercase, restrained -->
  <text x="170" y="232"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="300"
        font-size="120"
        letter-spacing="-2"
        fill="#E8E8E8">budget</text>

  <!-- Separator slash — muted grey -->
  <text x="615" y="232"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="300"
        font-size="120"
        fill="#3A3A3A">/</text>

  <!-- "THRILLS" — heavy, uppercase, neon lime, glow -->
  <text x="690" y="240"
        font-family="'Arial Black','Inter','Helvetica Neue',Arial,sans-serif"
        font-weight="900"
        font-size="170"
        letter-spacing="-4"
        fill="#A8FF00"
        filter="url(#limeGlow)">THRILLS</text>

  <!-- Small underline accent under THRILLS -->
  <rect x="690" y="260" width="690" height="4" fill="#A8FF00" opacity="0.35"/>
</svg>
