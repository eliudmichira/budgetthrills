<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.tailwindcss.com https://www.gstatic.com https://apis.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://i.ebayimg.com https://lh3.googleusercontent.com https://*.googleusercontent.com https://firebasestorage.googleapis.com https://www.google-analytics.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://firestore.googleapis.com https://www.gstatic.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.google-analytics.com https://*.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://apis.google.com;">
<title>Create account — BudgetThrills</title>
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg">
<link rel="stylesheet" href="/styles/fonts.css">
<link rel="stylesheet" href="/styles/app.css?v=4">
<link rel="stylesheet" href="/styles/main.css?v=4">
<link rel="stylesheet" href="/styles/auth.css">
<script>(function(){try{var t=localStorage.getItem('bt-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body data-page="signup">

  <div class="auth-shell">
    <div class="auth-art">
      <div class="art-eyebrow">BudgetThrills · Members</div>
      <a href="/signin.html" class="art-link">Have an account? Sign in →</a>
      <div class="art-h">First<br>dibs<span class="lime">.</span></div>
    </div>

    <div class="auth-pane">
      <div class="auth-top">
        <a href="/" class="flex items-center"><img loading="lazy" src="/brand/logo-dark.svg" alt="BudgetThrills" class="h-7 w-auto"></a>
        <button data-theme-toggle class="theme-toggle" aria-label="Toggle theme"><svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
      </div>

      <div class="auth-body">
        <div class="eyebrow mb-4">Join</div>
        <h1 class="display text-[48px] sm:text-[64px] leading-[0.95] mb-3 lg:hidden">First<br>dibs<span class="text-lime">.</span></h1>
        <p class="text-mute mb-10">Drops land Fridays at 8PM. Members get the link 30 minutes early.</p>

        <div class="auth-sso mb-2">
          <button type="button" id="signup-google-btn"><svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8a12 12 0 1 1 0-24c3 0 5.8 1.1 7.9 3l5.7-5.7A20 20 0 1 0 24 44a20 20 0 0 0 19.6-23.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8A12 12 0 0 1 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7A20 20 0 0 0 6.3 14.7z"/><path fill="#4CAF50" d="M24 44a20 20 0 0 0 13.4-5.2l-6.2-5.2A12 12 0 0 1 12.7 28l-6.5 5A20 20 0 0 0 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2c-.4.4 6.6-4.8 6.6-14.8 0-1.3-.1-2.7-.4-3.5z"/></svg>Sign up with Google</button>
        </div>

        <div class="auth-divider">or with email</div>

        <form data-auth-form>
          <div class="grid grid-cols-2 gap-x-5">
            <div class="auth-field"><label>First name</label><input type="text" autocomplete="given-name" required></div>
            <div class="auth-field"><label>Last name</label><input type="text" autocomplete="family-name" required></div>
          </div>
          <div class="auth-field"><label>Email</label><input type="email" autocomplete="email" required></div>
          <div class="auth-field"><label>Phone number</label><input type="tel" autocomplete="tel" placeholder="(555) 000-0000" required></div>
          <div class="auth-field"><label>Password</label><input type="password" autocomplete="new-password" required minlength="8"><span class="hint">8+ characters, with a number and a symbol.</span></div>

          <label class="checkbox-row mb-4"><input type="checkbox" required> I agree to the <a href="/terms.html">Terms</a> and <a href="/privacy.html">Privacy Policy</a></label>
          <label class="checkbox-row mb-8"><input type="checkbox" checked> Send me drop alerts (you can unsubscribe any time)</label>

          <button type="submit" class="btn-lime btn-block">Create account <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 5l7 7-7 7"/></svg></button>
        </form>

        <p class="text-sm text-mute mt-10">Already a member? <a href="/signin.html" class="text-ink hover:text-lime">Sign in →</a></p>
      </div>

      <div class="auth-foot">
        <a href="/help.html" class="hover:text-ink">Help</a>
        <div class="flex gap-6"><a href="/privacy.html" class="hover:text-ink">Privacy</a><a href="/terms.html" class="hover:text-ink">Terms</a></div>
      </div>
    </div>
  </div>

  <script src="/scripts/analytics.js?v=1" defer></script>

  <script src="/scripts/main.js?v=4" defer></script>
  <script type="module" src="/scripts/auth.js?v=29"></script>
</body>
</html>
